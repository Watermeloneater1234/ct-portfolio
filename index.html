<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <title>Portfolio</title>
</head>

<body>
    <div class="page-layout">
        <header>
            <div class="logo">
                <img src="your-icon.png" alt="Logo">
                <span class="brand">My portfolio</span>
            </div>

            <nav class="links">
                <a href="/home">Home</a>
                <a href="/about">About</a>
                <a href="/contact">Contact</a>
            </nav>
        </header>

        <main>
            <h1 class="title">My name</h1>

            <!-- ROW 1 -->
            <section class="row">
                <div class="text">
                    <h2>Section One</h2>
                    <p>Me</p>
                </div>
                <img class="image" src="yourimage123" alt="Image 1">
            </section>

            <!-- ROW 2 (left side) -->
            <section class="row2">
                <div class="text">
                    <h2>Section Two</h2>
                    <p>HOBBy?</p>
                </div>
                <img class="image" src="also ur image 123" alt="Image 2">
            </section>

            <!-- ROW 3 -->
            <section class="row">
                <div class="text">
                    <h2>Section Three</h2>
                    <p>Not decided</p>
                </div>
                <img class="image" src="more image" alt="Image 3">
            </section>

        </main>

    </div>
</body>

</html>
